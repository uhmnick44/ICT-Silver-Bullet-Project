# Configuration A — as_taught_5m (research baseline, NOT a recommended strategy)
[meta]
name = "as_taught_5m"
description = "ICT Silver Bullet as taught: 5m FVG, 15m swing-structure bias, 15m BSL/SSL liquidity, displacement 1.5 ATR, next opposing liquidity target, 1 trade per window"
stop_substitution_note = "USER-AUTHORIZED MODIFICATION of the original screenshot methodology: stop = liquidity_sweep_extreme, one MNQ tick beyond the extreme wick of the qualifying liquidity sweep event (penetration bar through confirming bar, frozen at setup confirmation). The original named configurations placed the stop beyond the displacement swing, whose structural definition is unresolved."
research_baseline = true

[signal]
windows = ["sb_london", "sb_ny_am", "sb_ny_pm"]
liquidity_universe = "bsl_ssl_15m"
fvg_timeframe = "5m"
min_fvg_points = 0.0
min_fvg_atr = 0.0
require_mss = false
require_displacement = true
displacement_threshold = 1.5
bias_detector = "swing_15m_structure"
require_bias = false
require_penetration_in_window = false
max_trades_per_window = 1
pending_order_policy = "keep_first"

[target]
type = "opposing_liquidity"
r_multiple = 2.0
fallback = "fixed_r"
fallback_r_multiple = 2.0
fill_rule = "trade_through"

[series]
series_id = "mnq_volcross_next_session_backadj_v1"
layer2_config = "configs/layer2_features.toml"

[entry]
location = "midpoint"
fill_rule = "trade_through"
marketable_at_activation = "fill_at_limit"
expiry = "window_end"
round_midpoint = "away_from_proximal"

[stop]
type = "liquidity_sweep_extreme"       # USER-AUTHORIZED MODIFICATION: one tick beyond the qualifying sweep's extreme wick
buffer_ticks = 1                       # one MNQ tick beyond the sweep extreme
fixed_points = 20.0

[exit]
policy = "rth_end"                     # ASSUMPTION: original exit policy unspecified; positions closed at 16:00 ET open bar
same_bar_rule = "stop_first"
time_exit_price = "next_bar_open"

[costs]
commission_per_side = 0.39
exchange_fee_per_side = 0.36
clearing_fee_per_side = 0.19
entry_slippage_ticks = 0
target_slippage_ticks = 0
stop_slippage_ticks = 1
time_exit_slippage_ticks = 1

[sizing]
contracts = 1

[roll]
policy = "flag_and_exclude"
